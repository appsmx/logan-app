<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="720" height="220" role="img" aria-label="LOGAN — sistema operativo de IA">
  <defs>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc15e"/>
      <stop offset="0.5" stop-color="#f7982f"/>
      <stop offset="1" stop-color="#d1611e"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#ffe3a8"/>
      <stop offset="0.5" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#e07a24"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Símbolo de orquestación (hub + satélites) a la izquierda -->
  <g transform="translate(20,20)">
    <circle cx="90" cy="90" r="86" fill="none" stroke="#ffb347" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="4 16" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0 90 90" to="360 90 90" dur="22s" repeatCount="indefinite"/>
    </circle>
    <!-- líneas -->
    <g stroke="url(#amber)" stroke-width="3.5" stroke-opacity="0.55" stroke-linecap="round">
      <line x1="90" y1="90" x2="90" y2="18"/>
      <line x1="90" y1="90" x2="152" y2="126"/>
      <line x1="90" y1="90" x2="28" y2="126"/>
    </g>
    <!-- satélites -->
    <g fill="url(#amber)" filter="url(#glow)">
      <circle cx="90" cy="18" r="13"/>
      <circle cx="152" cy="126" r="13"/>
      <circle cx="28" cy="126" r="13"/>
    </g>
    <!-- núcleo con pulso -->
    <circle cx="90" cy="90" r="30" fill="url(#core)" filter="url(#glow)"/>
    <circle cx="90" cy="90" r="30" fill="none" stroke="#fff4dd" stroke-opacity="0.7" stroke-width="2.5">
      <animate attributeName="r" values="30;50;30" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.7;0;0.7" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Wordmark LOGAN -->
  <text x="240" y="140"
        font-family="'Geist', 'Segoe UI', system-ui, sans-serif"
        font-size="112" font-weight="700" letter-spacing="4"
        fill="url(#amber)">LOGAN</text>
  <!-- subrayado tech -->
  <rect x="242" y="158" width="418" height="4" rx="2" fill="url(#amber)" opacity="0.6"/>
  <text x="244" y="192"
        font-family="'Geist Mono','Courier New',monospace"
        font-size="19" letter-spacing="7" fill="#b89a7e">SISTEMA OPERATIVO DE IA</text>
</svg>
