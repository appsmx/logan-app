<?xml version="1.0" encoding="UTF-8"?>
<!-- CONCEPTO A — "L-Brújula": la L es también una aguja de navegación (Navigation) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="LOGAN — L brújula">
  <defs>
    <linearGradient id="bgA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161311"/><stop offset="1" stop-color="#0b0908"/>
    </linearGradient>
    <linearGradient id="amberA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd27a"/><stop offset="0.55" stop-color="#f7982f"/><stop offset="1" stop-color="#d1611e"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgA)" stroke="#2a2320" stroke-width="2"/>
  <!-- anillo de brújula -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#amberA)" stroke-opacity="0.30" stroke-width="10"/>
  <!-- ticks cardinales -->
  <g stroke="url(#amberA)" stroke-width="8" stroke-linecap="round" stroke-opacity="0.55">
    <line x1="256" y1="92" x2="256" y2="118"/>
    <line x1="256" y1="394" x2="256" y2="420"/>
    <line x1="92" y1="256" x2="118" y2="256"/>
    <line x1="394" y1="256" x2="420" y2="256"/>
  </g>
  <!-- La L como aguja: vástago vertical (apunta al norte) + base -->
  <path d="M256 150 L256 340 L360 340" fill="none" stroke="url(#amberA)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- punta de aguja norte -->
  <path d="M256 130 L238 168 L274 168 Z" fill="url(#amberA)"/>
  <!-- núcleo -->
  <circle cx="256" cy="256" r="18" fill="#fff4dd"/>
</svg>
