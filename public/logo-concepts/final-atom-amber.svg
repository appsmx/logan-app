<?xml version="1.0" encoding="UTF-8"?>
<!-- FINAL — L átomo, versión ÁMBAR (marca actual) para comparar contra la tornasol -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="LOGAN — L con estructura atómica, ámbar">
  <defs>
    <linearGradient id="bgA2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161311"/><stop offset="1" stop-color="#0b0908"/>
    </linearGradient>
    <linearGradient id="amberL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd27a"/><stop offset="0.55" stop-color="#f7982f"/><stop offset="1" stop-color="#d1611e"/>
    </linearGradient>
    <filter id="gA2" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgA2)" stroke="#2a2320" stroke-width="2"/>

  <g fill="none" stroke="url(#amberL)" stroke-width="4" stroke-opacity="0.38">
    <ellipse cx="256" cy="256" rx="184" ry="74" transform="rotate(30 256 256)"/>
    <ellipse cx="256" cy="256" rx="184" ry="74" transform="rotate(90 256 256)"/>
    <ellipse cx="256" cy="256" rx="184" ry="74" transform="rotate(150 256 256)"/>
  </g>

  <g fill="url(#amberL)" filter="url(#gA2)">
    <circle r="13">
      <animateMotion dur="6s" repeatCount="indefinite"
        path="M 256 74 a 184 74 30 1 0 0 364 a 184 74 30 1 0 0 -364"/>
    </circle>
    <circle r="13">
      <animateMotion dur="7.5s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"
        path="M 256 74 a 184 74 90 1 0 0 364 a 184 74 90 1 0 0 -364"/>
    </circle>
    <circle r="13">
      <animateMotion dur="9s" repeatCount="indefinite"
        path="M 256 74 a 184 74 150 1 0 0 364 a 184 74 150 1 0 0 -364"/>
    </circle>
  </g>

  <path d="M200 148 L200 356 L350 356" fill="none" stroke="url(#amberL)" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M200 148 L200 356 L350 356" fill="none" stroke="#fff4dd" stroke-opacity="0.30" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" transform="translate(-7,-7)"/>
  <circle cx="200" cy="356" r="15" fill="#fff4dd" filter="url(#gA2)"/>
</svg>
