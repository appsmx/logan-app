<?xml version="1.0" encoding="UTF-8"?>
<!-- CONCEPTO B — "Monograma sólido": L moderna en cuadrado, estilo Vercel/Linear. Máxima simplicidad y memorabilidad. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="LOGAN — monograma L">
  <defs>
    <linearGradient id="amberB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc860"/><stop offset="0.55" stop-color="#f7982f"/><stop offset="1" stop-color="#c9591a"/>
    </linearGradient>
    <linearGradient id="glossB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- placa con gradiente de marca (el color ES el fondo → muy memorable) -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#amberB)"/>
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#glossB)"/>
  <!-- L negativa (recortada en el color) -->
  <path d="M182 150 L182 362 L360 362 L360 306 L238 306 L238 150 Z" fill="#141110"/>
  <!-- detalle tech: punto de acento en la esquina de la L -->
  <circle cx="210" cy="334" r="14" fill="url(#amberB)"/>
</svg>
