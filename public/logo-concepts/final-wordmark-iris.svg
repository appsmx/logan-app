<?xml version="1.0" encoding="UTF-8"?>
<!-- FINAL WORDMARK — símbolo L-átomo tornasol + texto LOGAN (horizontal, para header) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" width="760" height="220" role="img" aria-label="LOGAN — sistema operativo de IA">
  <defs>
    <linearGradient id="irisW" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/><stop offset="0.5" stop-color="#a855f7"/><stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="orbW1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="gW" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- símbolo -->
  <g transform="translate(24,26)">
    <g fill="none" stroke="url(#orbW1)" stroke-width="2.6" stroke-opacity="0.42">
      <ellipse cx="84" cy="84" rx="80" ry="32" transform="rotate(30 84 84)"/>
      <ellipse cx="84" cy="84" rx="80" ry="32" transform="rotate(90 84 84)"/>
      <ellipse cx="84" cy="84" rx="80" ry="32" transform="rotate(150 84 84)"/>
    </g>
    <g filter="url(#gW)">
      <circle r="7" fill="#7dd3fc">
        <animateMotion dur="6s" repeatCount="indefinite" path="M 84 4 a 80 32 30 1 0 0 160 a 80 32 30 1 0 0 -160"/>
      </circle>
      <circle r="7" fill="#a855f7">
        <animateMotion dur="7.5s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear" path="M 84 4 a 80 32 90 1 0 0 160 a 80 32 90 1 0 0 -160"/>
      </circle>
    </g>
    <path d="M62 44 L62 128 L128 128" fill="none" stroke="url(#irisW)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- wordmark -->
  <text x="220" y="128" font-family="'Geist','Segoe UI',system-ui,sans-serif" font-size="104" font-weight="700" letter-spacing="3" fill="url(#irisW)">LOGAN</text>
  <text x="224" y="176" font-family="'Geist Mono','Courier New',monospace" font-size="18" letter-spacing="7" fill="#8ea3c7">SISTEMA OPERATIVO DE IA</text>
</svg>
